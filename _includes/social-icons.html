<ul class="social{% if include.class %} {{ include.class }}{% endif %}">
{%- for s in site.social %}
  <li><a href="{{ s.url }}" target="_blank" rel="noopener" aria-label="Foluke on {{ s.name }}" title="{{ s.name }}">
    {%- case s.name -%}
    {%- when "Instagram" -%}<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.3" fill="currentColor"/></svg>
    {%- when "Facebook" -%}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.9v3h2.6V21z"/></svg>
    {%- when "TikTok" -%}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.2 3c.3 2.3 1.7 3.8 4 4v3.1c-1.5.1-2.8-.4-4-1.2v6.3A6 6 0 1 1 10.3 9.2v3.2a2.8 2.8 0 1 0 2.8 2.8V3z"/></svg>
    {%- when "YouTube" -%}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.6 2.6 0 0 0 2.4 7.2 27 27 0 0 0 2 12a27 27 0 0 0 .4 4.8 2.6 2.6 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8A27 27 0 0 0 22 12a27 27 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg>
    {%- endcase -%}
  </a></li>
{%- endfor %}
</ul>
